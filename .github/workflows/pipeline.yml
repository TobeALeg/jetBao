name: PR CI and production CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: jetbao-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: jetbao-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: jetbao-frontend:ci
          build-args: |
            VITE_BASE_PATH=/
            VITE_API_BASE_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish:
    name: Publish immutable images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_prefix=ghcr.io/${owner}/jetbao" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-frontend:${{ github.sha }}
          build-args: |
            VITE_BASE_PATH=/
            VITE_API_BASE_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy jetbao.mentti.work
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prepare release metadata
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
        run: |
          test -n "$SSO_CLIENT_SECRET"
          umask 077
          printf '%s\n' \
            "AUTH_MODE=${AUTH_MODE:-hybrid}" \
            'SSO_AUTHORIZE_URL=https://mentti.work/sso/authorize' \
            'SSO_TOKEN_URL=https://mentti.work/api/sso/token' \
            'SSO_CLIENT_ID=jetbao' \
            "SSO_CLIENT_SECRET=$SSO_CLIENT_SECRET" \
            'SSO_REDIRECT_URI=https://jetbao.mentti.work/api/auth/sso/callback' \
            'SSO_EMAIL_DOMAIN=mentitrek.com' \
            'SSO_LOGOUT_URL=https://mentti.work/api/auth/logout' \
            'SSO_COOKIE_SECURE=true' \
            > sso.env
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/jetbao/app /opt/jetbao/scripts'
          scp compose.production.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/jetbao/app/compose.production.yml.candidate"
          scp sso.env \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/jetbao/app/sso.env.candidate"
          scp scripts/deploy-production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/jetbao/scripts/deploy-production.sh"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'chmod 600 /opt/jetbao/app/sso.env.candidate && chmod 750 /opt/jetbao/scripts/deploy-production.sh'
      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' PUBLIC_BASE_URL='https://jetbao.mentti.work' bash /opt/jetbao/scripts/deploy-production.sh"
