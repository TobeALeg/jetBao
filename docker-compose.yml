services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_OCR_REGION: ${TENCENT_OCR_REGION:-ap-guangzhou}
      TENCENT_OCR_ENDPOINT: ${TENCENT_OCR_ENDPOINT:-ocr.tencentcloudapi.com}
      TENCENT_OCR_ACTION: ${TENCENT_OCR_ACTION:-RecognizeGeneralInvoice}
      TENCENT_OCR_PDF_PAGE: ${TENCENT_OCR_PDF_PAGE:-1}
      TENCENT_OCR_ENABLE_MULTIPLE_PAGE: ${TENCENT_OCR_ENABLE_MULTIPLE_PAGE:-true}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    volumes:
      - ./backend/data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${FRONTEND_BASE_PATH:-/}
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
