services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      OCR_API_KEY: ${OCR_API_KEY:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    volumes:
      - ./backend/data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${FRONTEND_BASE_PATH:-/}
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
